<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>404 — Page not found</title>
<meta content="noindex, follow" name="robots"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="styles.css" rel="stylesheet"/>
<meta content="https://www.metallagentur.at/logo_de.webp" property="og:image"/><meta content="https://www.metallagentur.at/logo_de.webp" name="twitter:image"/><link href="https://www.metallagentur.at/" rel="canonical"/></head>
<body>
<main style="min-height: 100vh; display: grid; place-items: center; padding: var(--space-6) 1.5rem; background: linear-gradient(180deg, var(--color-paper) 0%, var(--color-paper-warm) 100%);">
<div style="max-width: 560px; text-align: center;">
<p style="font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent); margin-bottom: 1rem;">Error 404</p>
<h1 style="font-family: var(--font-display); font-size: var(--text-3xl); margin: 0 0 1.5rem;">Diese Seite existiert nicht.</h1>
<div style="display: grid; gap: 1rem; max-width: 460px; margin: var(--space-4) auto; font-family: var(--font-display); font-size: var(--text-md); color: var(--color-ink-soft);">
<p style="margin: 0;"><strong>DE</strong> — Diese Seite wurde verschoben oder gibt es nicht mehr.</p>
<p style="margin: 0;"><strong>HU</strong> — Ez az oldal nem található vagy áthelyezésre került.</p>
<p style="margin: 0;"><strong>EN</strong> — This page has moved or no longer exists.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: var(--space-5);">
<a class="btn btn--primary" href="index.html">Zur Startseite (DE)</a>
<a class="btn btn--secondary" href="hu.html">Kezdőlap (HU)</a>
<a class="btn btn--secondary" href="en.html">Home (EN)</a>
</div>
</div>
</main>
<script>
(function() {
  'use strict';
  // Csak technikai cookie-k vannak (session) — nincs tracking/analytics
  // TKG 2021 §165 Abs 3: "unbedingt erforderlich" cookies = keine Einwilligung nötig
  // Trotzdem: Hinweis empfohlen (Österreichische Datenschutzbehörde Empfehlung)
  
  var key = 'cookie_notice_v1';
  if (sessionStorage.getItem(key)) return;
  
  var lang = document.documentElement.lang || 'de';
  var l = lang.slice(0,2);
  
  var texts = {
    de: { 
      msg: 'Diese Website verwendet ausschließlich technisch notwendige Cookies. Es werden keine Tracking- oder Analyse-Cookies gesetzt.',
      link: 'de-datenschutz.html', 
      linkText: 'Datenschutz',
      ok: 'Verstanden', 
      more: 'Details'
    },
    hu: { 
      msg: 'Ez a weboldal kizárólag technikailag szükséges sütiket használ. Nyomkövető vagy elemzési sütik nincsenek.',
      link: 'hu-adatvedelem.html', 
      linkText: 'Adatvédelem',
      ok: 'Rendben', 
      more: 'Részletek'
    },
    en: { 
      msg: 'This website uses only technically necessary cookies. No tracking or analytics cookies are set.',
      link: 'en-privacy.html', 
      linkText: 'Privacy',
      ok: 'Got it', 
      more: 'Details'
    }
  };
  
  var t = texts[l] || texts.de;
  
  var banner = document.createElement('div');
  banner.className = 'cookie-banner';
  banner.setAttribute('role', 'dialog');
  banner.setAttribute('aria-label', t.ok);
  banner.innerHTML = 
    '<p class="cookie-banner__text">' + t.msg + 
    ' &mdash; <a href="' + t.link + '">' + t.linkText + '</a></p>' +
    '<div class="cookie-banner__actions">' +
    '<button class="cookie-banner__btn cookie-banner__btn--decline" data-action="more">' + t.more + '</button>' +
    '<button class="cookie-banner__btn cookie-banner__btn--accept" data-action="ok">' + t.ok + '</button>' +
    '</div>';
  
  document.body.appendChild(banner);
  
  setTimeout(function() { banner.classList.add('is-visible'); }, 300);
  
  banner.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.dataset.action;
    if (action === 'ok') {
      sessionStorage.setItem(key, '1');
      banner.classList.remove('is-visible');
      setTimeout(function() { banner.remove(); }, 400);
    } else if (action === 'more') {
      window.location.href = t.link;
    }
  });
})();
</script>
</body>
</html>
