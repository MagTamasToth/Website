<script>
(function() {
  'use strict';
  // Csak technikai cookie-k vannak (session) — nincs tracking/analytics
  // TKG 2021 §165 Abs 3: "unbedingt erforderlich" cookies = keine Einwilligung nötig
  // Trotzdem: Hinweis empfohlen (Österreichische Datenschutzbehörde Empfehlung)
  
  var key = 'cookie_notice_v1';
  if (sessionStorage.getItem(key)) return;
  
  var lang = document.documentElement.lang || 'de';
  var l = lang.slice(0,2);
  
  var texts = {
    de: { 
      msg: 'Diese Website verwendet ausschließlich technisch notwendige Cookies. Es werden keine Tracking- oder Analyse-Cookies gesetzt.',
      link: 'de-datenschutz.html', 
      linkText: 'Datenschutz',
      ok: 'Verstanden', 
      more: 'Details'
    },
    hu: { 
      msg: 'Ez a weboldal kizárólag technikailag szükséges sütiket használ. Nyomkövető vagy elemzési sütik nincsenek.',
      link: 'hu-adatvedelem.html', 
      linkText: 'Adatvédelem',
      ok: 'Rendben', 
      more: 'Részletek'
    },
    en: { 
      msg: 'This website uses only technically necessary cookies. No tracking or analytics cookies are set.',
      link: 'en-privacy.html', 
      linkText: 'Privacy',
      ok: 'Got it', 
      more: 'Details'
    }
  };
  
  var t = texts[l] || texts.de;
  
  var banner = document.createElement('div');
  banner.className = 'cookie-banner';
  banner.setAttribute('role', 'dialog');
  banner.setAttribute('aria-label', t.ok);
  banner.innerHTML = 
    '<p class="cookie-banner__text">' + t.msg + 
    ' &mdash; <a href="' + t.link + '">' + t.linkText + '</a></p>' +
    '<div class="cookie-banner__actions">' +
    '<button class="cookie-banner__btn cookie-banner__btn--decline" data-action="more">' + t.more + '</button>' +
    '<button class="cookie-banner__btn cookie-banner__btn--accept" data-action="ok">' + t.ok + '</button>' +
    '</div>';
  
  document.body.appendChild(banner);
  
  setTimeout(function() { banner.classList.add('is-visible'); }, 300);
  
  banner.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.dataset.action;
    if (action === 'ok') {
      sessionStorage.setItem(key, '1');
      banner.classList.remove('is-visible');
      setTimeout(function() { banner.remove(); }, 400);
    } else if (action === 'more') {
      window.location.href = t.link;
    }
  });
})();
</script>
